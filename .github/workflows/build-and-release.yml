name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: next
        run: |
          set -euo pipefail

          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            next=1
          else
            next=$(( ${latest#v} + 1 ))
          fi

          echo "Latest tag: ${latest:-<none>} -> next tag: v${next}"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: mvn -B -ntp package -Dblaze.version="$TAG"

      - name: Verify jar version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(unzip -p server/target/blaze.jar META-INF/MANIFEST.MF | tr -d '\r' | awk '/^Implementation-Version:/ {print $2}')"
          echo "Built jar version: $version"
          test "$version" = "$TAG"

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: blaze-jar
          path: server/target/blaze.jar
          if-no-files-found: error

  release:
    name: Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: blaze-jar

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          cp blaze.jar "blaze-${TAG}.jar"

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

          gh release create "$TAG" "blaze-${TAG}.jar" blaze.jar \
            --title "Blaze ${TAG}" \
            --generate-notes
