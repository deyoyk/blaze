-dontshrink
-dontoptimize
-dontnote
-dontwarn **

# Strip source file names and line numbers, but keep library metadata intact.
-keepattributes Exceptions,InnerClasses,Signature,Deprecated,*Annotation*,EnclosingMethod

# Keep the server, Bukkit/CraftBukkit, NMS and all shaded dependencies intact.
-keep class !lol.deyo.blaze.** { *; }

# Config keys are derived from field names through reflection.
-keepclassmembers class * extends lol.deyo.blaze.configs.extra.Config {
    <fields>;
}
-keepclassmembers class lol.deyo.blaze.configs.** {
    <fields>;
}
-keepclassmembers class lol.deyo.blaze.knockback.** {
    <fields>;
}

# Enum constants and the reflective values()/valueOf() methods are resolved by name.
-keepclassmembers enum * {
    <fields>;
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# Log4j discovers console plugins by package and calls newInstance reflectively.
-keepclassmembers class * {
    public static *** newInstance(java.lang.String[]);
}

# Bukkit's configuration serializer looks up this static method by name.
-keepclassmembers class * implements org.bukkit.configuration.serialization.ConfigurationSerializable {
    static *** deserialize(java.util.Map);
}

-repackageclasses 'lol.deyo.blaze'
-overloadaggressively
-allowaccessmodification
