-dontshrink
-dontoptimize
-dontnote
-dontwarn **

-keepattributes Exceptions,InnerClasses,Signature,Deprecated,SourceFile,LineNumberTable,*Annotation*,EnclosingMethod

# Keep the server, Bukkit/CraftBukkit, NMS and all shaded dependencies intact.
-keep class !lol.deyo.blaze.** { *; }

# Config keys are derived from field names through reflection.
-keepclassmembers class * extends lol.deyo.blaze.configs.extra.Config {
    <fields>;
}
-keepclassmembers class lol.deyo.blaze.configs.** {
    <fields>;
}
-keepclassmembers class lol.deyo.blaze.knockback.** {
    <fields>;
}

# Log4j discovers console plugins by package and calls newInstance reflectively.
-keepclassmembers class * {
    public static *** newInstance(java.lang.String[]);
}

-repackageclasses 'lol.deyo.blaze'
-overloadaggressively
-allowaccessmodification
